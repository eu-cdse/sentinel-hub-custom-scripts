{{- $width := index .Attributes "width" -}}
{{- $height := index .Attributes "height" -}}
{{- $align := index .Attributes "align" -}}
<div class="image {{ with $align}}align-{{.}}{{ end }}">
    <img src="{{ .Destination | safeURL }}"
         alt="{{ .Text }}"
         {{ with $width }}width="{{ . }}"
         {{ end }}
         {{ with $height }}height="{{ . }}"
         {{ end }}
         {{ with .Title }}title="{{ . }}"
         {{ end }}
         loading="lazy">
</div>
