name: Deploy to GitHub Pages

on:
    push:
        branches: [staging]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            HUGO_VERSION: 0.169.0
        steps:
            # get the code
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            # install Hugo
            - name: Install Hugo
              run: |
                  curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o hugo.deb
                  sudo dpkg -i hugo.deb

            # install npm dependencies that js.Build bundles (fuse.js)
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # ask GitHub for URL
            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5

            # reuse processed images (resized/WebP) from previous builds
            - name: Cache processed images
              uses: actions/cache@v4
              with:
                  path: resources/_gen
                  key: hugo-resources-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.png', 'content/**/*.PNG', 'content/**/*.jpg', 'content/**/*.JPG', 'content/**/*.jpeg', 'content/**/*.gif', 'config/_default/hugo.toml', 'layouts/_partials/webp-image.html') }}
                  # prefer a cache from the same Hugo version, else any older one
                  restore-keys: |
                      hugo-resources-${{ env.HUGO_VERSION }}-
                      hugo-resources-

            # build
            - name: Build
              run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

            # hand /public over
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    # publish what build uploaded
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
